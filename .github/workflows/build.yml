name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  darwin:
    name: Darwin
    runs-on: macos-latest

    strategy:
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p docs/assets/darwin/${GOARCH}

          go build \
            -buildmode=c-shared \
            -o docs/assets/darwin/${GOARCH}/libbip0039.dylib \
            ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: docs/assets/darwin/${{ matrix.arch }}/

  linux:
    name: Linux
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p docs/assets/linux/${GOARCH}

          go build \
            -buildmode=c-shared \
            -o docs/assets/linux/${GOARCH}/libbip0039.so \
            ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: docs/assets/linux/${{ matrix.arch }}/

  windows:
    name: Windows
    runs-on: windows-latest

    strategy:
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p docs/assets/windows/${GOARCH}

          go build \
            -buildmode=c-shared \
            -o docs/assets/windows/${GOARCH}/bip0039.dll \
            ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: docs/assets/windows/${{ matrix.arch }}/