name: Build

on:
  push:
    branches:
      - feature/dev
  workflow_dispatch:

jobs:
  darwin:
    name: Darwin ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: |
          mkdir -p docs/assets/darwin/${GOARCH}

          go build \
            -buildmode=c-shared \
            -o docs/assets/darwin/${GOARCH}/libbip0039.dylib \
            ./share

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: docs/assets/darwin/${{ matrix.arch }}/


  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: |
          mkdir -p docs/assets/linux/${GOARCH}

          go build \
            -buildmode=c-shared \
            -o docs/assets/linux/${GOARCH}/libbip0039.so \
            ./share

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: docs/assets/linux/${{ matrix.arch }}/


  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: windows-latest

          - arch: arm64
            runner: windows-11-vs2026-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check ARM64 compiler
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          echo "========================================"
          echo "SYSTEM"
          echo "========================================"

          echo "PATH=$PATH"

          echo ""
          echo "Machine:"
          uname -m

          echo ""
          echo "System:"
          uname -a

          echo ""
          echo "========================================"
          echo "GCC"
          echo "========================================"

          echo "GCC path:"
          which gcc || true

          echo ""
          echo "GCC version:"
          gcc --version || true

          echo ""
          echo "GCC target:"
          gcc -dumpmachine || true

          echo ""
          echo "========================================"
          echo "GO"
          echo "========================================"

          echo "Go version:"
          go version

          echo ""
          echo "Go environment:"
          go env GOOS GOARCH GOHOSTOS GOHOSTARCH CGO_ENABLED CC CXX

          echo ""
          echo "========================================"
          echo "AVAILABLE ARM64 COMPILERS"
          echo "========================================"

          echo "aarch64-w64-mingw32-gcc:"
          which aarch64-w64-mingw32-gcc || true

          echo ""
          echo "aarch64-w64-mingw32-gcc version:"
          aarch64-w64-mingw32-gcc --version || true

          echo ""
          echo "========================================"
          echo "AVAILABLE GCC BINARIES"
          echo "========================================"

          find /mingw* /usr/bin /opt -type f \
            \( -name '*aarch64*gcc*' -o -name '*arm64*gcc*' \) \
            2>/dev/null || true

      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: |
          mkdir -p docs/assets/windows/${GOARCH}

          go build \
            -buildmode=c-shared \
            -o docs/assets/windows/${GOARCH}/bip0039.dll \
            ./share

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: docs/assets/windows/${{ matrix.arch }}/  